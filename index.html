html{background:#2b2023;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-text-size-adjust:100%;background:transparent}

.sub{color:var(--mute);margin:0 4px 20px;font:300 14px var(--sans)}

.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:rgba(66,54,56,.52);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#fff;font:400 14px var(--sans)}
.chip svg{width:15px;height:15px}
.lbl{font:400 17px var(--sans);color:#fff;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sm{color:var(--mute);font:300 15px var(--sans);margin:-2px 0 12px}
.quest{font:300 24px/1.3 var(--sans);letter-spacing:-.01em;margin:6px 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button.b{padding:11px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:var(--pill);color:#fff;font:400 15px var(--sans);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
button.p{background:#fff;color:#241c1e;border-color:#fff;font-weight:500}
button.hang{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);padding:13px 36px;box-shadow:0 12px 30px rgba(20,8,10,.3);font-size:16px;white-space:nowrap}

textarea{min-height:112px;padding:14px 16px;border-radius:22px;resize:vertical}
input[type=text]{padding:12px 18px;border-radius:999px}

.ent{border-top:1px solid rgba(255,255,255,.2);padding:14px 0}

.yb{padding:5px 12px!important}

.x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:0}
.addb{display:inline-block;padding:12px 22px;border-radius:999px;background:#fff;color:#241c1e;font:500 15px var(--sans);cursor:pointer}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.vt{position:relative;aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:rgba(0,0,0,.35)}
.vt video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vt span{position:absolute;left:8px;bottom:8px;color:#fff;font:600 12px var(--sans);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#vw{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:#000;color:#fff;font-family:var(--sans)}
#vf{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.rl{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}

.rcap{position:absolute;left:0;right:0;bottom:0;padding:44px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:10px;pointer-events:none}

.vx,.vm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:500 14px var(--sans);padding:9px 14px}
.vx{left:12px}.vm{right:12px}
#lk{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(40,26,30,.55);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 24px;overflow:auto;text-align:center;font-family:var(--sans)}
#lk.on{display:block}
.lkin{max-width:360px;margin:0 auto}
.lkt{font:300 24px var(--sans);margin:18px 0 8px}
.lkm{color:var(--mute);font-size:16px;min-height:50px;margin:8px 0 14px}
.lkm.err{color:#ffb4a8}
#padh{width:min(78vw,300px);margin:0 auto 10px}
#pd{width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#pd circle{fill:#fff;opacity:.5}
#pd circle.on{fill:#fff;opacity:1}
#pd line{stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.85}
body.locked main{visibility:hidden}
.foot{position:relative;z-index:1;text-align:center;color:var(--mute);font:300 12px var(--sans);padding:0 0 calc(env(safe-area-inset-bottom,0px) + 28px)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding:12px 16px;border-radius:22px;background:var(--pill);border:1px solid rgba(255,255,255,.14);font:300 13px/1.4 var(--sans);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.banner .lnk{padding:4px 0;flex:none}
</style>
</head>

 about your best day ever and why","Start a tiny project you can finish today","Say yes to one small invitation","Write down three things you’re proud of","Go to bed 30 minutes earlier","Learn to say hello in five languages","Make a list of 5 things you want this year","Do a digital detox for two hours","Try to solve a puzzle or riddle","Ask an elder for advice and listen","Write about today as if it’s a story"];
